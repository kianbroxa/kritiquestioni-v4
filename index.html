<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08060a">
  <meta name="description" content="KritiquestionI 4.0.3 — Cinema Edition. Uma sessão dupla particular para Kauan e Iasmin.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="KritiquestionI.png">
  <title>KritiquestionI 4.0.3 — Cinema Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cinema-bg" aria-hidden="true">
    <div class="cinema-bg__glow cinema-bg__glow--red"></div>
    <div class="cinema-bg__glow cinema-bg__glow--lilac"></div>
    <div class="cinema-bg__glow cinema-bg__glow--green"></div>
    <div class="cinema-bg__curtain cinema-bg__curtain--left"></div>
    <div class="cinema-bg__curtain cinema-bg__curtain--right"></div>
    <div class="cinema-bg__grain"></div>
    <div class="cinema-bg__vignette"></div>
  </div>

  <div class="bulb-rail" aria-hidden="true"></div>

  <div id="app" class="app"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="blackout" class="blackout" aria-hidden="true">
    <div class="blackout__beam"></div>
    <div class="blackout__content">
      <p class="blackout__text">APAGANDO AS LUZES</p>
      <div class="blackout__dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="blackout__note">KRITIQUESTIONI CINEMA · SALA 04.0.3</p>
    </div>
  </div>

  <div id="sr-status" class="sr-only" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;color:#f3eadc;font-family:sans-serif;text-align:center">Ative o JavaScript para abrir a sessão do KritiquestionI Cinema.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
